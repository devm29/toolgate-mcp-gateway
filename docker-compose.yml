# For completeness. Local development uses native binaries via `make services`;
# this file is the reproducible all-in-one stack. Secrets come from .env (see .env.example):
#   TOOLGATE_ADMIN_API_KEY, TOOLGATE_SESSION_SECRET, TOOLGATE_CONSOLE_SESSION_SECRET
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: toolgate
      POSTGRES_DB: toolgate
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "toolgate"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      TOOLGATE_DATABASE_URL: postgresql+asyncpg://toolgate@postgres:5432/toolgate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      TOOLGATE_ENV: ${TOOLGATE_ENV:-dev}
      TOOLGATE_PUBLIC_URL: http://localhost:8101
      TOOLGATE_DATABASE_URL: postgresql+asyncpg://toolgate@postgres:5432/toolgate
      TOOLGATE_REDIS_URL: redis://redis:6379/0
      TOOLGATE_ADMIN_API_KEY: ${TOOLGATE_ADMIN_API_KEY:?set TOOLGATE_ADMIN_API_KEY in .env}
      TOOLGATE_SESSION_SECRET: ${TOOLGATE_SESSION_SECRET:?set TOOLGATE_SESSION_SECRET in .env}
      TOOLGATE_CONSOLE_ORIGIN: http://localhost:3101
      TOOLGATE_CLASSIFIER: ${TOOLGATE_CLASSIFIER:-offline}
      TOOLGATE_DEMO_FIXTURES: ${TOOLGATE_DEMO_FIXTURES:-true}
    ports: ["8101:8101"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      TOOLGATE_API_ORIGIN: http://api:8101
      TOOLGATE_PUBLIC_URL: http://localhost:8101
      TOOLGATE_CONSOLE_URL: http://localhost:3101
      TOOLGATE_CONSOLE_SESSION_SECRET: ${TOOLGATE_CONSOLE_SESSION_SECRET:?set TOOLGATE_CONSOLE_SESSION_SECRET in .env}
    ports: ["3101:3101"]
    depends_on: [api]

volumes:
  pgdata:
